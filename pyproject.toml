[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "openv-engineering"
version = "0.1.0"
description = "A verification-first engineering V: proposals, external evidence, traceable redesign."
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.10,<3", "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1",
  "openai>=2,<4", "mcp>=1.20,<2", "python-dotenv>=1,<2", "httpx>=0.28,<1",
  "build123d>=0.10,<0.11", "aerosandbox>=4.2,<4.3",
  "ocp-gordon==0.1.17", "cadquery-ocp==7.8.1.1.post1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
openv = "openv.cli:main"

[tool.setuptools.packages.find]
include = ["openv*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
